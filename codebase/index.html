<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLearn · Flashcard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ---------------------------------------------------------
   TOKENS
--------------------------------------------------------- */
:root{
  --page:#EFF5F8;
  --paper:#FFFFFF;
  --paper-line:#DCE7ED;
  --ink:#2E548A;
  --ink-soft:#4E6E9B;
  --muted:#6F87AC;
  --accent:#2C6CA6;
  --accent-dark:#1F4E76;
  --warm:#C15B3A;
  --warm-dark:#9E4429;
  --success:#1B7FA8;
  --success-bg:#E1F0F6;
  --warning:#B8862B;
  --warning-bg:#FBF0DA;
  --danger:#B0402E;
  --danger-bg:#FBE7E2;
  --border:#C9DCE6;
  --shadow: 0 1px 2px rgba(46,84,138,.05), 0 6px 16px rgba(46,84,138,.10);
  --radius:10px;
  --serif:'Fraunces', serif;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans);
  background:var(--page);
  color:var(--ink);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(46,84,138,.06) 1px, transparent 0);
  background-size:22px 22px;
  pointer-events:none;
  z-index:0;
}
.shell{
  position:relative; z-index:1;
  max-width:1080px;
  margin:0 auto;
  padding:32px 24px 80px;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; color:var(--ink)}
p{line-height:1.55}
small{color:var(--muted)}

/* ---------------------------------------------------------
   HEADER
--------------------------------------------------------- */
.masthead{
  display:flex; align-items:baseline; justify-content:space-between;
  flex-wrap:wrap; gap:8px;
  margin-bottom:28px;
}
.masthead .brand{
  font-family:var(--serif); font-style:italic; font-weight:600;
  font-size:30px; letter-spacing:-.01em; color:var(--ink);
}
.masthead .brand span{color:var(--accent); font-style:normal}
.masthead .tagline{font-size:13.5px; color:var(--muted)}

/* Folder-tab mode switch */
.tabs{
  display:flex; gap:2px; margin-bottom:0; padding-left:2px;
}
.tabs button{
  font-family:var(--sans); font-weight:600; font-size:14px;
  border:1px solid var(--border); border-bottom:none;
  background:#DCE7ED; color:var(--ink-soft);
  padding:10px 20px 12px;
  border-radius:10px 10px 0 0;
  cursor:pointer;
  position:relative; top:1px;
  transition:background .15s, color .15s;
}
.tabs button:hover{background:#CFE0E9}
.tabs button.active{
  background:var(--paper); color:var(--ink);
  border-color:var(--border);
  box-shadow:0 -2px 0 var(--accent) inset;
}
.tabs button.active + button{margin-left:0}

.frame{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);
  padding:28px;
}

/* ---------------------------------------------------------
   GENERIC PANEL / FORM ELEMENTS
--------------------------------------------------------- */
.block{margin-bottom:32px}
.block:last-child{margin-bottom:0}
.block-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.block-head h2{font-size:19px}
.eyebrow{
  font-size:11.5px; color:var(--accent); font-weight:600;
  letter-spacing:.02em; margin-bottom:4px;
}

label.field-label{
  display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  margin:14px 0 6px;
}
label.field-label:first-of-type{margin-top:0}

input[type=text], input:not([type]), textarea, select{
  width:100%; font:inherit; font-size:14.5px;
  padding:10px 12px;
  border:1.5px solid var(--border); border-radius:8px;
  background:#fff; color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(61,107,92,.14);
}
textarea{resize:vertical; line-height:1.6}
.lesson-input{
  height:230px; font-family:var(--mono); font-size:13px;
  background-image:repeating-linear-gradient(#fff 0 27px, var(--paper-line) 27px 28px);
  line-height:28px; padding-top:9px;
  color:#111;
}

.chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chip{
  font-size:12px; background:#E1EDF5; color:var(--ink);
  padding:4px 10px; border-radius:100px; border:1px solid #CBDDE9;
}

/* ---------------------------------------------------------
   BUTTONS
--------------------------------------------------------- */
button{
  font-family:var(--sans); font-weight:600; font-size:14px;
  border:none; border-radius:8px; padding:10px 18px;
  background:var(--accent); color:#fff;
  cursor:pointer; transition:transform .1s, background .15s, box-shadow .15s;
}
button:hover{background:var(--accent-dark)}
button:active{transform:scale(.98)}
button:disabled{background:#B7BEB5; cursor:not-allowed; transform:none}
button.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--border)}
button.ghost:hover{background:#E4EEF5; color:var(--ink)}
button.warm{background:var(--warm)}
button.warm:hover{background:var(--warm-dark)}
button.success{background:var(--success)}
button.success:hover{background:#145F7D}
button.danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger-bg)}
button.danger:hover{background:var(--danger-bg)}
button.icon-only{padding:8px 10px}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}

/* ---------------------------------------------------------
   TOASTS
--------------------------------------------------------- */
#toasts{
  position:fixed; top:20px; right:20px; z-index:50;
  display:flex; flex-direction:column; gap:10px; max-width:340px;
}
.toast{
  background:var(--paper); border:1px solid var(--border);
  border-left:4px solid var(--ink-soft);
  border-radius:8px; padding:12px 14px; box-shadow:var(--shadow);
  font-size:14px; display:flex; gap:10px; align-items:flex-start;
  animation:slide-in .2s ease-out;
}
.toast.success{border-left-color:var(--success)}
.toast.warning{border-left-color:var(--warning)}
.toast.error{border-left-color:var(--danger)}
.toast .dot{font-size:16px; line-height:1}
.toast .msg{flex:1}
.toast .x{cursor:pointer; color:var(--muted); font-weight:700; background:none; padding:0; font-size:15px}
.toast .x:hover{color:var(--ink); background:none}
@keyframes slide-in{from{opacity:0; transform:translateX(16px)} to{opacity:1; transform:none}}

/* ---------------------------------------------------------
   FLASHCARD (editor grid, index-card look)
--------------------------------------------------------- */
.card-status{font-size:13.5px; color:var(--muted); margin-bottom:14px}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px}
.editor-card{
  background:var(--paper); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
  box-shadow:0 2px 0 rgba(46,84,138,.05);
}
.editor-card input, .editor-card textarea{color:#111}
.editor-card .row-head{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
}
.editor-card .idx{
  font-family:var(--mono); font-size:11.5px; color:var(--accent-dark);
  background:#E1EDF5; padding:2px 7px; border-radius:5px;
}
.source-box{
  margin-top:10px; background:#F3F9FC; border:1px dashed var(--paper-line);
  padding:9px 11px; border-radius:7px; font-size:13px; color:#111;
}
.source-box .pg{font-weight:700; color:var(--warm-dark); font-size:12px; margin-bottom:3px}

/* ---------------------------------------------------------
   DECK LIST (student)
--------------------------------------------------------- */
.deck-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px}
.deck-tile{
  background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; display:flex; flex-direction:column; gap:10px;
  box-shadow:0 2px 0 rgba(46,84,138,.05);
}
.deck-tile h3{font-size:16.5px}
.deck-tile .meta{font-size:13px; color:var(--muted)}
.empty-state{
  border:1.5px dashed var(--border); border-radius:var(--radius);
  padding:26px; text-align:center; color:var(--muted); font-size:14px;
}

/* ---------------------------------------------------------
   STUDY MODE — flip card + deck stack
--------------------------------------------------------- */
.study-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px}
.study-progress{
  width:100%; max-width:420px; margin-bottom:22px;
}
.study-progress .count{font-size:12.5px; color:var(--muted); margin-bottom:6px; text-align:center}
.study-progress .track{height:5px; background:var(--paper-line); border-radius:100px; overflow:hidden}
.study-progress .fill{height:100%; background:var(--accent); border-radius:100px; transition:width .25s}

.deck-stack{position:relative; width:100%; max-width:420px; height:300px; perspective:1400px}
.deck-shadow{
  position:absolute; inset:0; border-radius:14px; background:var(--paper);
  border:1px solid var(--border);
}
.deck-shadow.s1{transform:rotate(-3deg) translateY(6px); z-index:1}
.deck-shadow.s2{transform:rotate(3deg) translateY(10px); z-index:0; opacity:.7}

.flip-card{
  position:absolute; inset:0; z-index:2; cursor:pointer;
  transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.2,.2,1);
}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:14px; border:1.5px solid var(--border);
  padding:26px; display:flex; flex-direction:column;
  overflow-y:auto;
}
.flip-face.front{
  background:var(--paper); justify-content:center; align-items:center; text-align:center;
}
.flip-face.back{
  background:#F3F9FC; transform:rotateY(180deg); justify-content:flex-start;
}
.face-tag{
  font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--warm-dark);
  margin-bottom:12px;
}
.face-tag.q{color:var(--accent-dark)}
.front .q-text{
  font-family:var(--serif); font-size:23px; font-weight:600; line-height:1.4;
  color:#111;
}
.front .hint{margin-top:16px; font-size:12.5px; color:var(--muted)}
.back .a-text{font-size:15.5px; line-height:1.65; color:#111}
.back .a-text pre{
  background:var(--ink); color:#EAF2F8; padding:12px 14px; border-radius:7px;
  font-family:var(--mono); font-size:13.5px; line-height:1.5; overflow-x:auto;
}
.back .a-text code{font-family:var(--mono); font-size:.92em}
.back .src{
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--paper-line);
  font-size:12.5px; color:#111;
}
.back .src .pg{font-weight:700; color:var(--warm-dark)}

.study-controls{
  width:100%; max-width:420px; margin-top:22px;
  display:flex; flex-direction:column; gap:10px;
}
.study-controls .row{display:flex; gap:10px}
.study-controls .row button{flex:1}
.kbd-hint{font-size:12px; color:var(--muted); text-align:center; margin-top:2px}
.kbd-hint kbd{
  font-family:var(--mono); background:#E1EDF5; border:1px solid var(--border);
  border-radius:4px; padding:1px 5px; font-size:11px;
}

/* ---------------------------------------------------------
   REPORT DRAWER
--------------------------------------------------------- */
.drawer{
  margin-top:14px; padding:16px; background:#F3F9FC;
  border:1px solid var(--border); border-radius:var(--radius);
}

/* ---------------------------------------------------------
   REPORTS LIST (instructor)
--------------------------------------------------------- */
.report-row{
  background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:10px; font-size:13.5px;
}
.report-row .top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.status-pill{
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;
  text-transform:uppercase; letter-spacing:.02em;
}
.status-pill.open{background:var(--danger-bg); color:var(--danger)}
.status-pill.in_review{background:var(--warning-bg); color:var(--warning)}
.status-pill.resolved{background:var(--success-bg); color:var(--success)}
.report-row .desc{margin:8px 0; color:var(--ink-soft)}
.badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:19px; height:19px; padding:0 5px; border-radius:100px;
  background:var(--warm); color:#fff; font-size:11px; font-weight:700;
}

/* stats strip */
.stats-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.stat{
  background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 16px; min-width:120px;
}
.stat .num{font-family:var(--serif); font-size:24px; font-weight:600; color:var(--ink)}
.stat .lbl{font-size:12px; color:var(--muted)}

.hidden{display:none !important}

@media (max-width:600px){
  .shell{padding:20px 14px 60px}
  .frame{padding:18px}
  .flip-face{padding:18px}
}
</style>
</head>

<body>
<div id="toasts"></div>

<div class="shell">

  <header class="masthead">
    <div>
      <div class="brand">VLearn Flashcard</div>
      <div class="tagline">Flashcard cho bài giảng · tạo bằng AI, học theo kiểu thẻ lật</div>
    </div>
  </header>

  <nav class="tabs">
    <button id="instructorModeBtn" class="active" onclick="setMode('instructor')">Giảng viên</button>
    <button id="studentModeBtn" onclick="setMode('student')">Sinh viên</button>
  </nav>

  <main class="frame">

    <!-- ================= INSTRUCTOR ================= -->
    <section id="instructorView">

      <div class="block">
        <div class="block-head">
          <div>
            <div class="eyebrow">Bước 1</div>
            <h2>Tạo flashcard từ nội dung bài học</h2>
          </div>
        </div>

        <label class="field-label" for="lessonId">Bài học</label>
        <select id="lessonId" onchange="loadLessonContent()">
          <option value="day01">Day 01 · AI &amp; LLM Foundation</option>
          <option value="day02">Day 02 · Xác định bài toán cho AI</option>
        </select>

        <label class="field-label">Yêu cầu thêm</label>
        <input id="focus" placeholder="Tự động điền theo bài học">

        <label class="field-label">Nội dung bài học</label>
        <textarea id="lessonContent" class="lesson-input" placeholder="Nội dung bài học sẽ được nạp từ dữ liệu..."></textarea>

        <div class="toolbar">
          <button id="generateBtn" onclick="generateCards()">✨ Tạo flashcard bằng AI</button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <div>
            <div class="eyebrow">Bước 2</div>
            <h2>Kiểm duyệt trước khi phát hành</h2>
          </div>
        </div>
        <div id="cardStatus" class="card-status"></div>
        <div id="cards" class="card-grid"></div>

        <div id="publishArea" class="toolbar hidden">
          <button class="ghost" onclick="addCard()">+ Thêm thẻ trống</button>
          <button class="success" onclick="publishCards()">Phát hành flashcard</button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <div>
            <div class="eyebrow">Theo dõi</div>
            <h2>Báo cáo từ sinh viên <span id="reportBadge"></span></h2>
          </div>
          <button class="ghost" onclick="loadReports()">Tải lại</button>
        </div>
        <div id="reports"></div>
      </div>

    </section>

    <!-- ================= STUDENT ================= -->
    <section id="studentView" class="hidden">

      <div class="block">
        <label class="field-label">Mã số sinh viên</label>
        <input id="studentId" value="student-demo">
        <div class="toolbar">
          <button onclick="loadDecks()">Xem flashcard đã phát hành</button>
          <button class="ghost" onclick="loadProgress()">Tiến độ học tập</button>
        </div>
      </div>

      <div id="studentContent" class="block"></div>
      <div id="personalContent"></div>

    </section>

  </main>
</div>

<script>
const API="http://localhost:8000";
let flashcards=[];
let currentDeck=null;
let currentIndex=0;
let flipped=false;
let sessionCards=[];
let missedCards=[];
let studyRound=1;

/* ---------------- toasts ---------------- */
function notify(message,type="error"){
  const icons={success:"✓",warning:"!",error:"✕"};
  const el=document.createElement("div");
  el.className=`toast ${type}`;
  el.innerHTML=`
    <span class="dot">${icons[type]||"·"}</span>
    <span class="msg">${escapeHtml(message)}</span>
    <button class="x" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>el.remove(),6000);
}

function escapeHtml(value){
  const div=document.createElement("div");
  div.textContent=value??"";
  return div.innerHTML;
}

function renderMarkdown(text){
  try{ return marked.parse(text||""); }
  catch(e){ return escapeHtml(text); }
}

/* ---------------- mode switch ---------------- */
function setMode(mode){
  document.getElementById("instructorView").classList.toggle("hidden",mode!=="instructor");
  document.getElementById("studentView").classList.toggle("hidden",mode!=="student");
  document.getElementById("instructorModeBtn").classList.toggle("active",mode==="instructor");
  document.getElementById("studentModeBtn").classList.toggle("active",mode==="student");
}

/* ================= INSTRUCTOR ================= */

async function loadLessonContent(){
  const lessonId=document.getElementById("lessonId").value;
  const contentField=document.getElementById("lessonContent");
  const focusField=document.getElementById("focus");

  contentField.value="Đang tải nội dung bài học...";
  contentField.disabled=true;
  focusField.value="";

  try{
    const response=await fetch(`${API}/api/lesson-content/${lessonId}`);
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail||"Không tải được nội dung bài học.");

    contentField.value=result.content||"";
    focusField.value=(result.focus||[]).join(", ");
  }catch(error){
    contentField.value="";
    notify(error.message);
  }finally{
    contentField.disabled=false;
  }
}

async function generateCards(){
  const btn=document.getElementById("generateBtn");
  const content=document.getElementById("lessonContent").value.trim();
  const lessonId=document.getElementById("lessonId").value.trim();
  const focus=document.getElementById("focus").value
    .split(",").map(x=>x.trim()).filter(Boolean);

  if(!content){
    notify("Bài học chưa có dữ liệu.");
    return;
  }

  btn.disabled=true;
  btn.textContent="AI đang xử lý...";

  try{
    const response=await fetch(`${API}/api/generate_flashcards`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({content, lesson_id:lessonId, focus})
    });

    const result=await response.json();
    if(!response.ok) throw new Error(result.detail||"Generate thất bại.");

    if(!result.success){
      notify(result.message||"Không tạo được flashcard.");
      return;
    }

    flashcards=result.data||[];
    renderCards();

    if(result.warning) notify(result.warning,"warning");
    else notify(`Đã tạo ${flashcards.length} flashcard.`,"success");

  }catch(error){
    notify(error.message);
  }finally{
    btn.disabled=false;
    btn.textContent="✨ Tạo flashcard bằng AI";
  }
}

function renderCards(){
  const container=document.getElementById("cards");
  const publishArea=document.getElementById("publishArea");
  container.innerHTML="";

  if(!flashcards.length){
    publishArea.classList.add("hidden");
    document.getElementById("cardStatus").textContent="Chưa có flashcard nào. Hãy tạo bằng AI hoặc thêm thẻ trống.";
    return;
  }

  publishArea.classList.remove("hidden");
  document.getElementById("cardStatus").textContent=
    `${flashcards.length} flashcard đang ở trạng thái nháp — kiểm tra lại trước khi phát hành.`;

  flashcards.forEach((card,index)=>{
    if(!card.source) card.source = { page: 1, text: "" };
    const el=document.createElement("div");
    el.className="editor-card";
    el.innerHTML=`
      <div class="row-head">
        <span class="idx">Thẻ ${index+1}</span>
        <button class="danger icon-only" onclick="deleteCard(${index})">Xóa</button>
      </div>

      <label class="field-label">Câu hỏi</label>
      <input value="${escapeHtml(card.question)}"
        placeholder="Nhập câu hỏi ôn tập..."
        oninput="flashcards[${index}].question=this.value">

      <label class="field-label">Câu trả lời</label>
      <textarea rows="4"
        placeholder="Nhập câu trả lời ngắn gọn..."
        oninput="flashcards[${index}].answer=this.value">${escapeHtml(card.answer)}</textarea>

      <div class="source-box">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
          <label style="font-weight:700; color:var(--warm-dark); font-size:12px; margin:0">📖 Nguồn:</label>
          <div style="display:flex; align-items:center; gap:6px">
            <span style="font-size:12px; color:var(--muted)">Trang</span>
            <input type="number" min="1" style="width:65px; padding:3px 6px; font-size:12.5px"
              value="${card.source?.page ?? 1}"
              oninput="flashcards[${index}].source.page=parseInt(this.value)||1">
          </div>
        </div>
        <textarea rows="2" style="font-size:12.5px; padding:6px 8px"
          placeholder="Nhập trích đoạn từ slide / bài giảng làm căn cứ cho thẻ..."
          oninput="flashcards[${index}].source.text=this.value">${escapeHtml(card.source?.text ?? "")}</textarea>
      </div>
    `;
    container.appendChild(el);
  });
}

function addCard(){
  const lastPage = flashcards.length > 0 ? (flashcards[flashcards.length-1].source?.page || 1) : 1;
  flashcards.push({ id:null, question:"", answer:"", source:{ page:lastPage, text:"" } });
  renderCards();
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
}

function deleteCard(index){
  flashcards.splice(index,1);
  renderCards();
}

async function publishCards(){
  if(!flashcards.length){
    notify("Không có flashcard để phát hành.");
    return;
  }

  for(let i=0;i<flashcards.length;i++){
    const card=flashcards[i];
    if(!card.question.trim()) return notify(`Flashcard #${i+1} chưa có câu hỏi.`);
    if(!card.answer.trim()) return notify(`Flashcard #${i+1} chưa có câu trả lời.`);
    if(!card.source?.text?.trim()) return notify(`Flashcard #${i+1} chưa có nội dung nguồn trích dẫn.`);
    if(!card.source?.page || card.source.page < 1) card.source.page = 1;
  }

  try{
    const response=await fetch(`${API}/api/publish_flashcards`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        lesson_id:document.getElementById("lessonId").value,
        title:"Flashcard - "+document.getElementById("lessonId").value,
        flashcards
      })
    });

    const result=await response.json();
    if(!response.ok) throw new Error(result.detail||"Publish thất bại.");

    notify(result.message,"success");
    currentDeck=result.deck;
    flashcards=[];
    renderCards();

  }catch(error){
    notify(error.message);
  }
}

/* ---- reports (instructor) ---- */
async function loadReports(){
  try{
    const response=await fetch(`${API}/api/reports`);
    const result=await response.json();
    const container=document.getElementById("reports");
    const badge=document.getElementById("reportBadge");
    container.innerHTML="";

    const openCount=result.data.filter(r=>r.status==="open").length;
    badge.innerHTML = openCount ? `<span class="badge">${openCount}</span>` : "";

    if(!result.data.length){
      container.innerHTML=`<div class="empty-state">Chưa có báo cáo nào từ sinh viên.</div>`;
      return;
    }

    const typeLabels={
      wrong_answer:"Sai câu trả lời", wrong_source:"Sai nguồn",
      unclear_question:"Câu hỏi không rõ", code_error:"Sai code/công thức", other:"Khác"
    };
    const statusLabels={open:"Mới", in_review:"Đang xử lý", resolved:"Đã xử lý"};

    result.data.slice().reverse().forEach(report=>{
      const el=document.createElement("div");
      el.className="report-row";
      el.innerHTML=`
        <div class="top">
          <strong>${typeLabels[report.type]||escapeHtml(report.type)}</strong>
          <span class="status-pill ${report.status}">${statusLabels[report.status]||report.status}</span>
        </div>
        <p class="desc">${escapeHtml(report.description || "Không có mô tả")}</p>
        <small>Thẻ: ${escapeHtml(report.flashcard_id)} · Sinh viên: ${escapeHtml(report.student_id)}</small>
        <div class="toolbar">
          <button class="ghost" onclick="updateReport('${report.report_id}','in_review')">Đang xử lý</button>
          <button class="success" onclick="updateReport('${report.report_id}','resolved')">Đã xử lý</button>
        </div>
      `;
      container.appendChild(el);
    });

  }catch(error){
    notify(error.message);
  }
}

async function updateReport(reportId,status){
  try{
    const response=await fetch(`${API}/api/reports/${reportId}?status=${status}`,{ method:"PUT" });
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);
    notify("Đã cập nhật report.","success");
    loadReports();
  }catch(error){
    notify(error.message);
  }
}

/* ================= STUDENT ================= */

async function loadDecks(){
  const container=document.getElementById("studentContent");
  try{
    const response=await fetch(`${API}/api/decks`);
    const result=await response.json();

    container.innerHTML=`
      <div class="block-head"><h2>Flashcard đã phát hành</h2></div>
      <div id="publicDecks" class="deck-grid"></div>
    `;

    const publicDecks=document.getElementById("publicDecks");

    if(!result.data.length){
      publicDecks.outerHTML=`<div class="empty-state">Chưa có deck nào được phát hành.</div>`;
    }else{
      result.data.forEach(deck=>{
        const el=document.createElement("div");
        el.className="deck-tile";
        el.innerHTML=`
          <h3>${escapeHtml(deck.title)}</h3>
          <div class="meta">${deck.flashcards.length} flashcard</div>
          <div class="toolbar">
            <button onclick="startStudy('${deck.deck_id}')">Học</button>
            <button class="ghost" onclick="cloneDeck('${deck.deck_id}')">Sao bản cá nhân</button>
          </div>
        `;
        publicDecks.appendChild(el);
      });
    }

    await loadPersonalDecks();

  }catch(error){
    notify(error.message);
  }
}

async function startStudy(deckId, onlyMissed=false){
  try{
    if(!onlyMissed){
      const response=await fetch(`${API}/api/decks/${deckId}`);
      const result=await response.json();
      if(!response.ok) throw new Error(result.detail);

      currentDeck=result.data;
      sessionCards=[...currentDeck.flashcards];
      missedCards=[];
      studyRound=1;
    }else{
      sessionCards=[...missedCards];
      missedCards=[];
      studyRound++;
    }
    currentIndex=0;
    flipped=false;
    renderStudy();

  }catch(error){
    notify(error.message);
  }
}

function renderStudy(){
  const container=document.getElementById("studentContent");
  const card=sessionCards[currentIndex];
  const total=sessionCards.length;
  const pct=Math.round(((currentIndex+ (flipped?1:0.5))/total)*100);
  const roundBadge = studyRound > 1 ? `<span class="badge" style="background:var(--accent);margin-left:6px">Vòng ôn #${studyRound}</span>` : "";

  container.innerHTML=`
    <div class="study-wrap">
      <div class="study-progress">
        <div class="count">Thẻ ${currentIndex+1} / ${total} ${roundBadge}</div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      </div>

      <div class="deck-stack">
        <div class="deck-shadow s2"></div>
        <div class="deck-shadow s1"></div>
        <div class="flip-card ${flipped?'flipped':''}" id="flipCard" onclick="flipCard()">
          <div class="flip-face front">
            <div class="face-tag q">CÂU HỎI</div>
            <div class="q-text">${escapeHtml(card.question)}</div>
            <div class="hint">Nhấp hoặc bấm Space để xem đáp án</div>
          </div>
          <div class="flip-face back">
            <div class="face-tag">ĐÁP ÁN</div>
            <div class="a-text">${renderMarkdown(card.answer)}</div>
            <div class="src"><span class="pg">📖 Trang ${card.source.page}</span><br>${escapeHtml(card.source.text)}</div>
          </div>
        </div>
      </div>

      <div class="study-controls">
        <div class="row" id="reviewRow">
          ${flipped ? `
            <button class="danger" style="border:1.5px solid var(--danger); flex:1" onclick="review('not_remembered')">[1] Chưa nhớ</button>
            <button class="success" style="flex:1" onclick="review('remembered')">[2] Đã nhớ</button>
          ` : `<button class="ghost" onclick="flipCard()">Lật thẻ để xem đáp án (Space)</button>`}
        </div>

        <div class="row">
          <button class="ghost" onclick="previousCard()" ${currentIndex===0?'disabled':''}>← Trước</button>
          <button class="ghost" onclick="nextCard()">Sau →</button>
          <button class="warm" onclick="showReportForm()">Báo lỗi</button>
        </div>

        <div class="kbd-hint"><kbd>Space</kbd> lật thẻ · <kbd>1</kbd> Chưa nhớ · <kbd>2</kbd> Đã nhớ · <kbd>←</kbd> <kbd>→</kbd> chuyển thẻ</div>

        <div id="reportForm"></div>

        <button class="ghost" onclick="loadDecks()">Thoát về danh sách</button>
      </div>
    </div>
  `;
}

function flipCard(){
  flipped=!flipped;
  renderStudy();
}

async function review(result){
  const studentId=document.getElementById("studentId").value;
  const currentCard = sessionCards[currentIndex];
  if(result === "not_remembered"){
    if(!missedCards.some(c => c.id === currentCard.id)){
      missedCards.push(currentCard);
    }
  }
  try{
    await fetch(`${API}/api/flashcards/${currentCard.id}/review`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ student_id:studentId, result })
    });
    nextCard();
  }catch(error){
    notify(error.message);
  }
}

function nextCard(){
  if(currentIndex < sessionCards.length - 1){
    currentIndex++;
    flipped=false;
    renderStudy();
  }else{
    finishStudySession();
  }
}

function finishStudySession(){
  const container=document.getElementById("studentContent");
  const totalCards = sessionCards.length;
  const missedCount = missedCards.length;
  const rememberedCount = totalCards - missedCount;

  if(missedCount > 0){
    container.innerHTML=`
      <div class="study-wrap" style="text-align:center; max-width:480px; margin:20px auto">
        <div style="font-size:48px; margin-bottom:12px">🎯</div>
        <h2>Hoàn thành lượt học #${studyRound}!</h2>
        <p style="color:var(--ink-soft); margin:12px 0 20px; line-height:1.6">
          Bạn đã nhớ <strong>${rememberedCount}/${totalCards}</strong> thẻ.<br>
          Còn <strong>${missedCount}</strong> thẻ bạn đánh dấu <span style="color:var(--danger);font-weight:600">Chưa nhớ</span>.
        </p>
        <div class="toolbar" style="justify-content:center; gap:12px">
          <button class="warm" onclick="startStudy('${currentDeck.deck_id}', true)">🔁 Ôn lại ${missedCount} thẻ chưa nhớ ngay</button>
          <button class="ghost" onclick="loadProgress()">📊 Xem thống kê tiến độ</button>
          <button class="ghost" onclick="loadDecks()">← Về danh sách</button>
        </div>
      </div>
    `;
    notify(`Còn ${missedCount} thẻ chưa nhớ cần ôn lại.`, "warning");
  } else {
    container.innerHTML=`
      <div class="study-wrap" style="text-align:center; max-width:480px; margin:20px auto">
        <div style="font-size:48px; margin-bottom:12px">🌟</div>
        <h2>Xuất sắc! Bạn đã nhớ toàn bộ thẻ!</h2>
        <p style="color:var(--ink-soft); margin:12px 0 20px; line-height:1.6">
          Tất cả các thẻ trong bộ <strong>${escapeHtml(currentDeck.title)}</strong> đã được ôn tập và ghi nhớ hoàn tất.
        </p>
        <div class="toolbar" style="justify-content:center; gap:12px">
          <button class="success" onclick="loadProgress()">📊 Xem thống kê tiến độ</button>
          <button class="ghost" onclick="loadDecks()">← Về danh sách thẻ</button>
        </div>
      </div>
    `;
    notify("Chúc mừng bạn đã ghi nhớ 100% flashcard!", "success");
  }
}

function previousCard(){
  if(currentIndex>0){
    currentIndex--;
    flipped=false;
    renderStudy();
  }
}

document.addEventListener("keydown",(e)=>{
  if(!currentDeck || document.getElementById("studentView").classList.contains("hidden")) return;
  if(!document.getElementById("flipCard")) return;
  if(e.code==="Space"){ e.preventDefault(); flipCard(); }
  else if(flipped && (e.key==="1" || e.code==="Digit1" || e.code==="Numpad1")){ review("not_remembered"); }
  else if(flipped && (e.key==="2" || e.code==="Digit2" || e.code==="Numpad2")){ review("remembered"); }
  else if(e.code==="ArrowRight"){ nextCard(); }
  else if(e.code==="ArrowLeft"){ previousCard(); }
});

function showReportForm(){
  document.getElementById("reportForm").innerHTML=`
    <div class="drawer">
      <label class="field-label">Loại lỗi</label>
      <select id="reportType">
        <option value="wrong_answer">Sai câu trả lời</option>
        <option value="wrong_source">Sai nguồn</option>
        <option value="unclear_question">Câu hỏi không rõ</option>
        <option value="code_error">Sai code/công thức</option>
        <option value="other">Khác</option>
      </select>
      <label class="field-label">Mô tả</label>
      <textarea id="reportDescription" rows="3" placeholder="Mô tả vấn đề..."></textarea>
      <div class="toolbar">
        <button onclick="submitReport()">Gửi báo cáo</button>
        <button class="ghost" onclick="document.getElementById('reportForm').innerHTML=''">Hủy</button>
      </div>
    </div>
  `;
}

async function submitReport(){
  const studentId=document.getElementById("studentId").value;
  const card=currentDeck.flashcards[currentIndex];

  try{
    const response=await fetch(`${API}/api/flashcards/${card.id}/report`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        student_id:studentId,
        type:document.getElementById("reportType").value,
        description:document.getElementById("reportDescription").value
      })
    });

    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);

    notify(result.message,"success");
    document.getElementById("reportForm").innerHTML="";

  }catch(error){
    notify(error.message);
  }
}

async function cloneDeck(deckId){
  const studentId=document.getElementById("studentId").value;
  try{
    const response=await fetch(`${API}/api/decks/${deckId}/clone`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ student_id:studentId })
    });
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);
    notify(result.message,"success");
    await loadPersonalDecks();
  }catch(error){
    notify(error.message);
  }
}

async function loadProgress(){
  const studentId=document.getElementById("studentId").value;
  try{
    const response=await fetch(`${API}/api/students/${studentId}/progress`);
    const result=await response.json();

    document.getElementById("studentContent").innerHTML=`
      <div class="block-head"><h2>Tiến độ học tập</h2></div>
      <div class="stats-row">
        <div class="stat"><div class="num">${result.total_reviews}</div><div class="lbl">Lượt ôn</div></div>
        <div class="stat"><div class="num">${result.remembered}</div><div class="lbl">Đã nhớ</div></div>
        <div class="stat"><div class="num">${result.not_remembered}</div><div class="lbl">Chưa nhớ</div></div>
        <div class="stat"><div class="num">${result.remember_rate}%</div><div class="lbl">Tỷ lệ nhớ</div></div>
      </div>
    `;
  }catch(error){
    notify(error.message);
  }
}

async function loadPersonalDecks(){
  const studentId=document.getElementById("studentId").value;
  try{
    const response=await fetch(`${API}/api/students/${studentId}/personal-decks`);
    const result=await response.json();
    const container=document.getElementById("personalContent");

    if(!result.data.length){ container.innerHTML=""; return; }

    container.innerHTML=`
      <div class="block">
        <div class="block-head"><h2>Deck cá nhân</h2></div>
        <div id="personalDeckList" class="deck-grid"></div>
      </div>
    `;

    const list=document.getElementById("personalDeckList");
    result.data.forEach(deck=>{
      const el=document.createElement("div");
      el.className="deck-tile";
      el.innerHTML=`
        <h3>${escapeHtml(deck.title)}</h3>
        <div class="meta">${deck.flashcards.length} flashcard</div>
        <div class="toolbar"><button onclick="openPersonalDeck('${deck.deck_id}')">Chỉnh sửa</button></div>
      `;
      list.appendChild(el);
    });

  }catch(error){
    notify(error.message);
  }
}

async function openPersonalDeck(deckId){
  const studentId=document.getElementById("studentId").value;
  const response=await fetch(`${API}/api/students/${studentId}/personal-decks`);
  const result=await response.json();
  const deck=result.data.find(x=>x.deck_id===deckId);

  if(!deck){ notify("Không tìm thấy personal deck."); return; }

  const container=document.getElementById("studentContent");
  container.innerHTML=`
    <div class="block-head"><h2>${escapeHtml(deck.title)}</h2></div>
    <div id="personalCards" class="card-grid"></div>
    <div class="toolbar">
      <button onclick="addPersonalCard('${deck.deck_id}')">+ Thêm thẻ</button>
      <button class="ghost" onclick="loadDecks()">← Quay lại</button>
    </div>
  `;
  renderPersonalCards(deck);
}

function renderPersonalCards(deck){
  const container=document.getElementById("personalCards");
  container.innerHTML="";

  if(!deck.flashcards.length){
    container.innerHTML=`<div class="empty-state">Chưa có thẻ nào trong deck cá nhân này.</div>`;
    return;
  }

  deck.flashcards.forEach((card,index)=>{
    if(!card.source) card.source = { page: 1, text: "Ghi chú cá nhân của học viên." };
    const el=document.createElement("div");
    el.className="editor-card";
    el.innerHTML=`
      <div class="row-head">
        <span class="idx">Thẻ ${index+1}</span>
        <button class="danger icon-only" onclick="deletePersonalCard('${card.id}')">Xóa</button>
      </div>
      <label class="field-label">Câu hỏi</label>
      <input id="q-${card.id}" value="${escapeHtml(card.question)}">
      <label class="field-label">Câu trả lời</label>
      <textarea id="a-${card.id}" rows="3">${escapeHtml(card.answer)}</textarea>

      <div class="source-box">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
          <label style="font-weight:700; color:var(--warm-dark); font-size:12px; margin:0">📖 Nguồn:</label>
          <div style="display:flex; align-items:center; gap:6px">
            <span style="font-size:12px; color:var(--muted)">Trang</span>
            <input type="number" min="1" id="src-pg-${card.id}" style="width:65px; padding:3px 6px; font-size:12.5px"
              value="${card.source?.page ?? 1}">
          </div>
        </div>
        <textarea id="src-txt-${card.id}" rows="2" style="font-size:12.5px; padding:6px 8px"
          placeholder="Trích đoạn tài liệu hoặc ghi chú nguồn...">${escapeHtml(card.source?.text ?? "")}</textarea>
      </div>

      <div class="toolbar" style="margin-top:10px"><button onclick="savePersonalCard('${card.id}')">Lưu thay đổi</button></div>
    `;
    container.appendChild(el);
  });
}

async function savePersonalCard(cardId){
  const question=document.getElementById(`q-${cardId}`).value;
  const answer=document.getElementById(`a-${cardId}`).value;
  const pageEl=document.getElementById(`src-pg-${cardId}`);
  const textEl=document.getElementById(`src-txt-${cardId}`);
  const page=pageEl ? (parseInt(pageEl.value) || 1) : 1;
  const text=textEl ? (textEl.value.trim() || "Ghi chú cá nhân của học viên.") : "Ghi chú cá nhân của học viên.";

  if(!question.trim() || !answer.trim()){
    notify("Câu hỏi và câu trả lời không được để trống.");
    return;
  }

  try{
    const response=await fetch(`${API}/api/personal-flashcards/${cardId}`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ 
        question, 
        answer, 
        source: { page, text }
      })
    });
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);
    notify("Đã lưu thay đổi flashcard cá nhân.","success");
  }catch(error){
    notify(error.message);
  }
}

async function deletePersonalCard(cardId){
  if(!confirm("Xóa flashcard này?")) return;
  try{
    const response=await fetch(`${API}/api/personal-flashcards/${cardId}`,{ method:"DELETE" });
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);
    notify(result.message,"success");
    await loadDecks();
  }catch(error){
    notify(error.message);
  }
}

async function addPersonalCard(deckId){
  const question=prompt("Nhập câu hỏi:");
  if(!question?.trim()) return;
  const answer=prompt("Nhập câu trả lời:");
  if(!answer?.trim()) return;
  const sourceText=prompt("Nhập trích đoạn nguồn / ghi chú bài học:", "Ghi chú cá nhân của học viên") || "Ghi chú cá nhân của học viên";
  const pageStr=prompt("Nhập số trang tài liệu:", "1") || "1";
  const page=parseInt(pageStr) || 1;

  const studentId=document.getElementById("studentId").value;

  try{
    const response=await fetch(`${API}/api/personal-flashcards`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ 
        student_id:studentId, 
        deck_id:deckId, 
        question, 
        answer,
        source: { page, text: sourceText }
      })
    });
    const result=await response.json();
    if(!response.ok) throw new Error(result.detail);
    notify("Đã thêm flashcard cá nhân.","success");
    openPersonalDeck(deckId);
  }catch(error){
    notify(error.message);
  }
}

loadLessonContent();
renderCards();
</script>
